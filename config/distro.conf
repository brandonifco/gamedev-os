# Single source of truth for build-time identity.
# Rename the distro here and it propagates through the build.

DISTRO_NAME="GameDevOS"      # working title — rename freely
DISTRO_ID="gamedevos"        # lowercase slug used in paths
DISTRO_VERSION="0.1.0"
DISTRO_CODENAME="ignition"

# Base
BASE_DISTRO="ubuntu"
BASE_SUITE="noble"           # Ubuntu 24.04 LTS
BASE_MIRROR="http://archive.ubuntu.com/ubuntu/"
ARCH="amd64"

# Desktop / shell
DESKTOP="xfce4"
DEFAULT_SHELL="/usr/bin/fish"

# Optional components
INCLUDE_WARDEN="false"       # AI-agent sandbox layer (WIP) — opt-in; see components/warden/

# Toolchains
DOTNET_CHANNEL="10.0"        # LTS
GODOT_VERSION="4.4.1"        # .NET/C# build — pin as desired
NVIDIA_BRANCH="550"          # TODO: confirm branch for your GPU (may be 570/580 by now)
